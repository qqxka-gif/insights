<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Facebook-figyelő – Figyelő</title>
<meta name="description" content="Kerületi Facebook-figyelő: ki mit posztol, és hogyan reagálnak rá a kommentelők – a Figyelő rovata.">
<meta name="robots" content="noindex">
<script>try{if(localStorage.getItem("figyelo-kiadas")==="nappali")document.documentElement.classList.add("nappali")}catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,400;1,9..144,600&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="../assets/glossy.css">
<style>
/* Facebook-figyelő-specifikus komponensek. A közös stílus: ../assets/glossy.css (glossy szál). */
/* --- Facebook-figyelő kiegészítések --- */
.tiles { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
@media (max-width: 640px) { .tiles { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.tile { padding: 14px; border-radius: 12px; background: linear-gradient(160deg, var(--panel-a), var(--panel-b)); border: 1px solid rgba(255,255,255,0.07); color: var(--panel-fg); display: flex; flex-direction: column; gap: 4px; }
.tile b { font-family: var(--font-display); font-size: 26px; font-weight: 600; line-height: 1; font-variant-numeric: tabular-nums; }
.tile span { font-size: 11px; color: var(--panel-muted); }
.rank { display: grid; grid-template-columns: 30px minmax(0, 1fr) auto; align-items: center; gap: 12px; padding: 9px 0; border-bottom: 1px solid var(--hair); }
.rank .r { font-family: var(--font-display); font-size: 22px; font-weight: 600; color: var(--muted); }
.rank .lbl { font-size: 14px; font-weight: 600; }
.rank .sub { font-size: 12px; color: var(--muted); }
.rank .v { font-family: var(--font-mono); font-size: 12px; color: var(--muted); text-align: right; font-variant-numeric: tabular-nums; }
.track { height: 7px; border-radius: 4px; background: var(--track); overflow: hidden; margin-top: 5px; }
.fill { height: 100%; border-radius: 4px; background: linear-gradient(90deg, var(--acc), var(--chart)); box-shadow: 0 0 10px var(--aglow); }
.vd { display: inline-flex; align-items: center; padding: 2px 9px; border-radius: 999px; font-size: 11px; font-weight: 600; white-space: nowrap; }
.vd.pos { color: var(--pos); background: color-mix(in srgb, var(--pos) 16%, transparent); }
.vd.neg { color: var(--neg); background: color-mix(in srgb, var(--neg) 14%, transparent); }
.vd.mix { color: var(--fb); background: color-mix(in srgb, var(--fb) 16%, transparent); }
.vd.neu { color: var(--muted); background: var(--pill); }
.tone-row { display: flex; flex-direction: column; gap: 6px; padding: 12px 0; border-bottom: 1px solid var(--hair); }
.tone-row .hd { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: space-between; }
.tone-row .nm { font-family: var(--font-display); font-size: 17px; font-weight: 600; }
.sbar { display: flex; height: 12px; border-radius: 6px; overflow: hidden; gap: 2px; background: var(--track); }
.sbar div { height: 100%; }
.slegend { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 12px; color: var(--muted); }
.slegend span { display: inline-flex; align-items: center; gap: 6px; }
.slegend i { width: 10px; height: 10px; border-radius: 2px; display: block; }
.rxleg { gap: 8px 18px; }
.rxleg .rg { font-size: 18px; line-height: 1; }
.tone-row details summary, .pg details summary { cursor: pointer; color: var(--acc); font-size: 12px; font-weight: 500; }
.tone-row details p { margin: 6px 0 0; font-size: 14px; color: var(--muted); max-width: 70ch; }
.post { display: grid; grid-template-columns: 30px minmax(0, 1fr); gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--hair); text-align: left; width: 100%; background: none; border-left: 0; border-right: 0; border-top: 0; cursor: pointer; color: inherit; font: inherit; }
.post:hover b { color: var(--acc); }
.post .r { font-family: var(--font-display); font-size: 22px; font-weight: 600; color: var(--acc); line-height: 1.1; }
.post b { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; font-size: 14px; font-weight: 600; line-height: 1.4; }
.post .meta { font-size: 12px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 4px; }
.rg { font-family: "Segoe UI Emoji", "Apple Color Emoji", "Noto Color Emoji", sans-serif; }
.rx { display: inline-flex; align-items: center; gap: 3px; font-size: 12px; }
.cm { display: grid; grid-template-columns: 26px minmax(0, 1fr); gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--hair); }
.cm .rk { width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; font-size: 12px; font-weight: 700; color: #0A0E14; }
.cm .who { font-size: 12px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 4px; }
.cm .tx { margin: 0 0 6px; font-size: 14px; line-height: 1.5; white-space: pre-wrap; word-break: break-word; }
.cm .ft { font-size: 12px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.link { font: inherit; font-size: 12px; font-weight: 600; color: var(--acc); background: none; border: 0; padding: 0; cursor: pointer; text-align: left; }
.toxtag { font-size: 10px; font-weight: 700; padding: 1px 7px; border-radius: 999px; color: var(--ground); background: #B79CFF; }
.hidden { position: relative; min-height: 44px; margin-bottom: 6px; }
.hidden p { filter: blur(5px); user-select: none; margin: 0; font-size: 14px; }
.reveal { position: absolute; inset: 0; margin: auto; width: max-content; height: 34px; font-size: 12px; font-weight: 600; border-radius: 999px; padding: 0 12px; cursor: pointer; border: 1px solid var(--hair); background: var(--page-a); color: var(--text); }
.rbtn { font-size: 12px; font-weight: 600; border: 1px solid var(--hair); border-radius: 999px; padding: 3px 10px; cursor: pointer; min-height: 28px; background: var(--pill); color: var(--acc); }
.thread { margin-top: 8px; display: flex; flex-direction: column; gap: 8px; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--hair); background: var(--pill); }
.reply { display: flex; flex-direction: column; gap: 3px; padding-top: 6px; border-top: 1px solid var(--hair); }
.reply:first-of-type { border-top: 0; padding-top: 0; }
.rtags { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; font-size: 11px; color: var(--muted); }
.rtext { font-size: 13px; line-height: 1.45; white-space: pre-wrap; word-break: break-word; }
.rtext.author { color: var(--acc); font-weight: 600; }
.deb { border: 1px solid var(--hair); border-radius: 12px; padding: 12px 14px; display: flex; flex-direction: column; gap: 8px; background: var(--pill); }
.deb .hd { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font-size: 12px; color: var(--muted); }
.dbadge { font-size: 11px; font-weight: 700; padding: 2px 9px; border-radius: 999px; }
.db-bad { color: var(--ground); background: var(--neg); } .db-hot { color: var(--neg); background: color-mix(in srgb, var(--neg) 16%, transparent); }
.db-ok { color: var(--pos); background: color-mix(in srgb, var(--pos) 16%, transparent); } .db-mix { color: var(--muted); background: var(--track); }
.dbar { display: flex; height: 8px; border-radius: 4px; overflow: hidden; background: var(--track); }
.selrow { display: flex; flex-wrap: wrap; gap: 8px; align-items: flex-end; }
.selrow label { display: flex; flex-direction: column; gap: 3px; font-size: 11px; color: var(--muted); }
.selrow select { min-height: 38px; padding: 0 10px; border-radius: 9px; border: 1px solid var(--hair); background: var(--page-a); color: var(--text); font-size: 13px; }
.pg .hd { display: flex; gap: 14px; align-items: flex-start; }
.pg .av { width: 52px; height: 52px; flex: none; border-radius: 50%; display: grid; place-items: center; font-family: var(--font-display); font-weight: 600; font-size: 19px; color: var(--acc); border: 1px solid var(--hair); background: var(--pill); box-shadow: 0 0 18px var(--aglow); }
.pg .nm { font-family: var(--font-display); font-size: 24px; font-weight: 600; line-height: 1.1; }
.pg .role { font-size: 13px; color: var(--muted); }
.summary { margin: 0; font-size: 15px; line-height: 1.55; max-width: 70ch; }
.bars svg { display: block; width: 100%; height: auto; }
/* Összevetés */
.cmp-row { display: flex; flex-direction: column; gap: 5px; padding: 9px 0; border-bottom: 1px solid rgba(255,255,255,0.08); }
.cmp-row.low { opacity: 0.55; }
.cmp-hd { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; flex-wrap: wrap; font-size: 13px; }
.cmp-nm { font-weight: 600; }
.cmp-nm small { font-weight: 400; color: var(--panel-muted); }
.cmp-eng { font-family: var(--font-mono); font-size: 11px; color: var(--panel-muted); font-variant-numeric: tabular-nums; }
.cmp-eng b { font-family: var(--font-display); font-size: 15px; color: var(--panel-fg); }
.panel .note { color: var(--panel-muted); margin-top: 8px; }
.scat text { font-family: "IBM Plex Mono", monospace; }
/* Poszt-részletező */
.ov { position: fixed; inset: 0; z-index: 400; background: rgba(6, 9, 14, 0.62); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); display: flex; align-items: flex-start; justify-content: center; padding: calc(var(--top) + 16px) 16px 40px; overflow-y: auto; }
html.nappali .ov { background: rgba(60, 50, 30, 0.35); }
.dlg { position: relative; width: min(760px, 100%); box-sizing: border-box; padding: 24px 28px 26px; border-radius: 16px; display: flex; flex-direction: column; gap: 14px; background: linear-gradient(180deg, var(--page-a), var(--page-b)); border: 1px solid var(--edge); box-shadow: var(--lift), 0 0 90px var(--aglow); }
@media (max-width: 640px) { .ov { padding: var(--top) 0 0; } .dlg { border-radius: 0; min-height: calc(100vh - var(--top)); padding: 20px 16px; } }
.dlg .x { position: absolute; top: 14px; right: 14px; width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--hair); background: var(--pill); cursor: pointer; display: grid; place-items: center; }
.dlg .ptext { margin: 0; font-size: 16px; line-height: 1.55; white-space: pre-wrap; padding-right: 40px; }
</style>
</head>
<body>
<div id="modal"></div>

<script src="../assets/config.js"></script>
<script src="../assets/figyelo-lapok.js"></script>
<script>
(function () {
"use strict";
const API = ((window.FIGYELO && window.FIGYELO.FB_API) || "").replace(/\/+$/, "");

/* ---------- segédek ---------- */
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const safe = u => { try { const x = new URL(u); return /^https?:$/.test(x.protocol) ? x.href : "#"; } catch (e) { return "#"; } };
const arr = x => Array.isArray(x) ? x : [];
const fmtN = n => n == null ? "–" : String(n).replace(/\B(?=(\d{3})+(?!\d))/g, " ");
const store = { get: k => { try { return localStorage.getItem(k); } catch (e) { return null; } }, set: (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} } };
const reduced = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
const TZ = "Europe/Budapest";
const dayKey = d => d.toLocaleDateString("sv-SE", { timeZone: TZ });
function fmtDate(iso, withTime) {
  if (!iso) return "–";
  const d = new Date(iso), now = new Date();
  const t = d.toLocaleTimeString("hu-HU", { timeZone: TZ, hour: "2-digit", minute: "2-digit" });
  if (dayKey(d) === dayKey(now)) return "ma " + t;
  if (dayKey(d) === dayKey(new Date(now - 864e5))) return "tegnap " + t;
  return d.toLocaleDateString("hu-HU", { timeZone: TZ, month: "short", day: "numeric" }) + (withTime ? " " + t : "");
}
const RX = { like: ["Tetszik", "👍", "#6FB3FF"], love: ["Imádom", "❤️", "#F28DB2"], care: ["Törődöm", "🥰", "#F7D774"], haha: ["Haha", "😆", "#F2B35B"], wow: ["Hűha", "😮", "#7FD1A6"], sad: ["Szomorú", "😢", "#B79CFF"], angry: ["Dühös", "😡", "#E8913F"] };
const rxChips = list => arr(list).map(r => { const m = RX[r.type] || [r.type, "•"]; return '<span class="rx" title="' + esc(m[0]) + ": " + fmtN(r.n) + '"><span class="rg" aria-label="' + esc(m[0]) + '">' + m[1] + "</span>" + fmtN(r.n) + "</span>"; }).join(" ");
const vcls = v => /támogató/.test(v || "") ? "pos" : /kritikus/.test(v || "") ? "neg" : v === "Megosztott" ? "mix" : "neu";
const verdict = v => '<span class="vd ' + vcls(v) + '">' + esc(v || "Nincs adat") + "</span>";
const dcls = l => l === "Elfajult vita" ? "db-bad" : l === "Vita" ? "db-hot" : l === "Egyetértő" ? "db-ok" : "db-mix";
const initials = n => String(n || "").replace(/^Dr\.?\s+/, "").split(/\s+/).map(w => w[0] || "").join("").slice(0, 2).toUpperCase();
const textHTML = t => String(t || "").split(/(\[\[.*?\]\])/).filter(Boolean).map(p => p.startsWith("[[") ? "[név]" : esc(p)).join("");
const short = (t, n) => { const s = String(t || "").replace(/\s+/g, " ").trim(); return s.length > n ? s.slice(0, n - 1) + "…" : s; };
const TONE_COL = { sup: "var(--pos)", neu: "var(--neu)", crit: "var(--neg)" };

let D = null;
const st = { ptab: "comments", ctab: "pos", cacc: "", dacc: "", pacc: "", mtab: 0 };
const revealed = new Set(), opened = new Set();
let post = null;
const accById = id => (D.accounts.find(a => a.id === id) || {});

/* ---------- lapok ---------- */
const LAPS = [
  { type: "overview", short: "Áttekintés" },
  { type: "pages", short: "Oldalak rangsora", title: "A figyelt oldalak rangsora", kicker: "Az összes reakció alapján" },
  { type: "compare", short: "Összevetés", title: "Ki milyen visszhangot kap?", kicker: "Hangulat és interakció 1000 követőre, oldalanként" },
  { type: "tone", short: "Hangulat", title: "Ki hogyan fogadja?", kicker: "Az első szintű kommentek hangulata oldalanként" },
  { type: "posts", short: "Top posztok", title: "A legnépszerűbb posztok", kicker: "Toplista · kattints egy posztra a részletekért" },
  { type: "reactions", short: "Reakciók", title: "Milyen reakciókat kaptak?", kicker: "Reakciók megoszlása oldalanként" },
  { type: "comments", short: "Kommentek", title: "A legtöbbet kedvelt kommentek", kicker: "Támogató és kritikus hozzászólások, a kommentelők neve nélkül" },
  { type: "debates", short: "Viták", title: "Viták a válaszokban", kicker: "Legalább 3 válaszos szálak, a leghevesebb elöl" },
  { type: "page", short: "Oldalak részletesen", title: "Oldalak részletesen", kicker: "Összefoglaló és posztok oldalanként" },
  { type: "method", short: "Módszertan", title: "Honnan jönnek a számok?", kicker: "Módszertan és korlátok" }
];
const tabsHTML = (k, items, extra) => '<div class="tabs" role="group">' + items.map(it => '<button type="button" data-set="' + k + '" data-val="' + esc(it[0]) + '" aria-pressed="' + (String(st[k]) === String(it[0])) + '">' + esc(it[1]) + "</button>").join("") + (extra || "") + "</div>";
const accSelect = (k, label) => '<div class="selrow"><label for="s-' + k + '">' + esc(label) + '<select id="s-' + k + '" data-filt="' + k + '"><option value="">Minden oldal</option>' + D.accounts.map(a => '<option value="' + esc(a.id) + '"' + (st[k] === a.id ? " selected" : "") + ">" + esc(a.name) + "</option>").join("") + "</select></label></div>";
const panel = (title, src, inner) => '<div class="panel"><div class="panel-head"><b>' + esc(title) + '</b><span class="src">' + esc(src) + "</span></div>" + inner + "</div>";
const allPosts = () => D.accounts.flatMap(a => a.posts.map(p => Object.assign({ acc: a }, p)));

function toc() {
  const items = LAPS.slice(1, 6).map((l, k) => '<button type="button" data-goto="' + (k + 1) + '"><span class="n">' + (k + 2) + '</span><span class="t-name">' + esc(l.short) + '</span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg></button>').join("");
  return '<nav class="col side" aria-label="Ebben a kiadásban"><h3 class="h3">Ebben a kiadásban</h3><div class="toc">' + items + '</div><span class="note">…és még ' + (LAPS.length - 6) + " lap. Görgess tovább.</span></nav>";
}
function barChart(days, vals, label) {
  const W = 600, Hh = 200, L = 30, R = 10, T = 10, B = 24, n = days.length, max = Math.max(1, ...vals);
  const step = Math.max(1, Math.ceil(max / 4)), top = step * 4, bw = (W - L - R) / n;
  let s = '<svg viewBox="0 0 ' + W + " " + Hh + '" role="img" aria-label="' + esc(label) + '">';
  for (let t = 0; t <= top; t += step) { const y = T + (Hh - T - B) * (1 - t / top); s += '<line x1="' + L + '" x2="' + (W - R) + '" y1="' + y + '" y2="' + y + '" stroke="var(--panel-grid)"/><text x="' + (L - 6) + '" y="' + (y + 4) + '" text-anchor="end" fill="var(--panel-muted)" font-size="10" font-family="IBM Plex Mono, monospace">' + t + "</text>"; }
  vals.forEach((v, i) => { const h = (Hh - T - B) * v / top, x = L + i * bw + bw * 0.18; s += '<rect x="' + x.toFixed(1) + '" y="' + (Hh - B - h).toFixed(1) + '" width="' + (bw * 0.64).toFixed(1) + '" height="' + h.toFixed(1) + '" rx="3" fill="var(--c-fb)" fill-opacity="' + (i === n - 1 ? 1 : 0.7) + '"><title>' + esc(days[i] + ": " + v) + "</title></rect>"; });
  const every = Math.ceil(n / 6);
  days.forEach((d, i) => { if (i % every === 0 || i === n - 1) s += '<text x="' + (L + i * bw + bw / 2).toFixed(1) + '" y="' + (Hh - 7) + '" text-anchor="middle" fill="var(--panel-muted)" font-size="10" font-family="IBM Plex Mono, monospace">' + esc(d.slice(5)) + "</text>"; });
  return s + "</svg>";
}
function toneBar(t) {
  return '<div class="sbar" role="img" aria-label="Támogató ' + t.sup + "%, semleges " + t.neu + "%, kritikus " + t.crit + '%"><div style="width:' + t.sup + "%;background:" + TONE_COL.sup + '"></div><div style="width:' + t.neu + "%;background:" + TONE_COL.neu + '"></div><div style="width:' + t.crit + "%;background:" + TONE_COL.crit + '"></div></div>' +
    '<div class="slegend"><span><i style="background:' + TONE_COL.sup + '"></i>Támogató ' + t.sup + '%</span><span><i style="background:' + TONE_COL.neu + '"></i>Semleges ' + t.neu + '%</span><span><i style="background:' + TONE_COL.crit + '"></i>Kritikus ' + t.crit + '%</span><span><i style="background:#B79CFF"></i>Sértő ' + (t.toxic || 0) + "%</span></div>";
}
function toneBlock(t) {
  if (!t || !t.n) return verdict(t && t.verdict || "Nincs adat") + '<p class="summary">' + esc((t && t.summary) || "Még nincs elemzett komment ebben az időszakban.") + "</p>";
  return '<div class="tabs">' + verdict(t.verdict) + (t.mood ? '<span class="vd neu">Hangnem: ' + esc(t.mood) + "</span>" : "") + (t.delta ? '<span class="note">' + esc(t.delta) + "</span>" : "") + "</div>" + toneBar(t) +
    (t.summary ? '<p class="summary">' + esc(t.summary) + "</p>" : "") + '<p class="note">' + fmtN(t.n) + " első szintű komment alapján" + (t.posts ? ", " + t.posts + " posztból" : "") + ".</p>";
}
function threadHTML(c) {
  const th = c.thread || {}, reps = arr(th.replies), d = th.debate;
  if (!reps.length) return "";
  const isOpen = opened.has(c.id);
  let html = '<button type="button" class="rbtn" data-thread="' + esc(c.id) + '">' + (isOpen ? "▾ " : "▸ ") + reps.length + " válasz" + (d ? " · " + esc(d.label) : "") + (d && d.author ? " · szerző is" : "") + "</button>";
  if (isOpen) {
    const head = d ? "Egyetért a kommenttel: " + d.agree + "% · Vitatkozik: " + d.dis + "% · Sértő válasz: " + d.toxic + (d.author ? " · A szerző is válaszolt." : "") : "Kevés válasz, vitajelző nincs.";
    html += '<div class="thread"><div class="note">' + esc(head) + (th.summary ? "<br>" + esc(th.summary) : "") + "</div>" + reps.map((r, i) => {
      const rid = c.id + ":" + i, hide = r.toxic && !revealed.has(rid);
      const rel = r.rel === "agree" ? "egyetért" : r.rel === "disagree" ? "vitatkozik" : "semleges";
      const stc = r.stance === "supportive" ? "támogatja a szerzőt" : r.stance === "critical" ? "kritikus a szerzővel" : "semleges a szerzővel";
      const body = hide ? '<div class="hidden"><p aria-hidden="true">' + textHTML(r.text) + '</p><button type="button" class="reveal" data-reveal="' + esc(rid) + '">Sértő tartalom – megjelenítés</button></div>' : '<span class="rtext' + (r.is_author ? " author" : "") + '">' + textHTML(r.text) + "</span>";

/* ---------- poszt-részletező ---------- */
async function openPost(id) {
  post = { loading: true }; st.mtab = 0; renderModal();
  try { const r = await fetch(API + "/api/post/" + encodeURIComponent(id)); if (!r.ok) throw new Error("HTTP " + r.status); post = await r.json(); }
  catch (e) { post = { error: "A poszt részletei most nem tölthetők be (" + e.message + ")." }; }
  renderModal();
}
function renderModal() {
  const m = $("modal");
  if (!post) { m.innerHTML = ""; document.documentElement.style.overflow = ""; return; }
  document.documentElement.style.overflow = "hidden";
  let body;
  if (post.loading) body = '<p class="loading">Betöltés…</p>';
  else if (post.error) body = '<p class="empty">' + esc(post.error) + "</p>";
  else {
    const p = post, labels = [[0, "Hangulat"], [1, "Top 5 támogató"], [2, "Top 5 kritikus"], [3, "Viták (" + arr(p.debates).length + ")"]];
    body = '<span class="kick mono">' + esc(p.name) + " · " + esc(p.role) + " · " + fmtDate(p.date, true) + '</span><p class="ptext">' + esc(p.text || "(kép vagy videó szöveg nélkül)") + "</p>" +
      '<div class="tabs"><span class="note">' + rxChips(p.reactions_top) + " · " + fmtN(p.reactions) + " reakció · " + fmtN(p.comments) + " komment" + (p.url ? ' · <a href="' + esc(safe(p.url)) + '" target="_blank" rel="noopener noreferrer">Megnyitás a Facebookon</a>' : "") + "</span></div>" +
      '<div class="tabs" role="group">' + labels.map(l => '<button type="button" data-mtab="' + l[0] + '" aria-pressed="' + (st.mtab === l[0]) + '">' + esc(l[1]) + "</button>").join("") + "</div>" +
      (st.mtab === 0 ? toneBlock(p.tone) : st.mtab === 3 ? debatesHTML(arr(p.debates), false) : commentsHTML(arr(st.mtab === 1 ? p.top_pos : p.top_neg), st.mtab === 1, false));
  }
  m.innerHTML = '<div class="ov rovat-fb" data-close="1"><div class="dlg" role="dialog" aria-modal="true" aria-label="Poszt részletei"><button type="button" class="x" data-close="1" aria-label="Bezárás"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>' + body + "</div></div>";
  const x = m.querySelector(".x"); if (x && !post.loading) x.focus();
}
function closePost() { post = null; renderModal(); }


/* ---------- lapmotor (közös: ../assets/figyelo-lapok.js, glossy szál) ---------- */
Figyelo.oldal({ rovat: "fb", alap: "../" });
const LM = Figyelo.lapok({ nev: "Facebook-figyelő", lapok: LAPS, rajzolo: R, allapot: st });

/* ---------- kattintások (rovatspecifikus; a data-goto / data-set / data-filt a lapmotoré) ---------- */
document.addEventListener("click", e => {
  const inModal = e.target.closest("#modal");
  const c = e.target.closest("[data-close]");
  if (c && (e.target.closest(".x") || !e.target.closest(".dlg"))) { closePost(); return; }
  const o = e.target.closest("[data-open]");
  if (o) { e.preventDefault(); openPost(o.getAttribute("data-open")); return; }
  const mt = e.target.closest("[data-mtab]");
  if (mt) { st.mtab = +mt.getAttribute("data-mtab"); renderModal(); return; }
  const rv = e.target.closest("[data-reveal]");
  if (rv) { revealed.add(rv.getAttribute("data-reveal")); inModal ? renderModal() : LM.ujra(rv); return; }
  const th = e.target.closest("[data-thread]");
  if (th) { const id = th.getAttribute("data-thread"); opened.has(id) ? opened.delete(id) : opened.add(id); inModal ? renderModal() : LM.ujra(th); }
});
document.addEventListener("keydown", e => { if (e.key === "Escape" && post) closePost(); });

/* ---------- indítás ---------- */
async function start() {
  LM.felepit();
  let errMsg = null;
  if (!API || /CSERELD-KI/.test(API)) errMsg = "A Pi címe még nincs beállítva (assets/config.js).";
  else {
    try {
      const ctl = new AbortController(), timer = setTimeout(() => ctl.abort(), 20000);
      const r = await fetch(API + "/api/dashboard", { signal: ctl.signal }); clearTimeout(timer);
      if (!r.ok) throw new Error("HTTP " + r.status);
      D = await r.json();
    } catch (e) { errMsg = "A Raspberry Pi nem válaszolt (" + (e.name === "AbortError" ? "időtúllépés" : e.message) + "). Próbáld újra néhány perc múlva."; }
  }
  if (errMsg) { Figyelo.hiba("Az adatforrás most nem érhető el. " + errMsg); D = { window_days: 15, last_ingest: null, accounts: [] }; }
  D.accounts = arr(D.accounts).map(a => Object.assign({ posts: [], reactions: [], debates: [], top_pos: [], top_neg: [] }, a));
  LM.mindet();
  LM.indit();
}
start();
})();
</script>
